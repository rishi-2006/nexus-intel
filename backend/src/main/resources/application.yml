server:
  port: ${PORT:8088}
  servlet:
    context-path: /

spring:
  application:
    name: nexus-intel-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nexus_intel}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USER:${SPRING_DATASOURCE_USERNAME:root}}
    password: ${DB_PASS:${SPRING_DATASOURCE_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  cache:
    type: simple

  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100

nexus:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai:
    provider: ${AI_PROVIDER:internal-rag}
    api-key: ${AI_API_KEY:}
    api-url: ${AI_API_URL:https://api.openai.com/v1/chat/completions}
    model: ${AI_MODEL:gpt-4o-mini}
    confidence-threshold: 0.75
    disclaimer: "AI-generated analytical findings require human verification and should not be treated as proof of wrongdoing."
  seed:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
